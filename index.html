  var y=now.getFullYear(),m=now.getMonth(),d=now.getDate(),ex=[];
  var items=[['food',24.5,'სუპერმარკეტი'],['transport',2.5,'მეტრო'],['food',12,'ყავა და სენდვიჩი'],['home',140,'კომუნალური'],['fun',35,'კინო'],['health',48,'აფთიაქი'],['food',68.4,'ყოველკვირეული ბაზარი'],['shop',120,'ზამთრის ქურთუკი'],['transport',18,'ტაქსი'],['food',9.8,'სადილი'],['other',20,'საჩუქარი']];
  for(var i=0;i<items.length;i++){
    var day=Math.max(1,d-Math.floor(i*d/items.length));
    ex.push({id:uid()+i,amt:items[i][1],cat:items[i][0],note:items[i][2],date:y+'-'+pad(m+1)+'-'+pad(day)});
  }
  return {income:2800,budgets:{food:600,transport:150,home:400,fun:200,health:150,shop:300,other:150},expenses:ex,demo:true};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.expenses)return o}}catch(e){}
  return demo();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function monthAll(m){return S.expenses.filter(function(e){return e.date.slice(0,7)===m})}
function monthExp(m){return monthAll(m).filter(function(e){return e.type!=='in'})}
function monthInc(m){return monthAll(m).filter(function(e){return e.type==='in'})}
function sum(a){return a.reduce(function(t,e){return t+e.amt},0)}
function byCat(list){var o={};list.forEach(function(e){o[e.cat]=(o[e.cat]||0)+e.amt});return o}
function mLabel(m){var p=m.split('-');return MONTHS[+p[1]-1]+' '+p[0]}
function shiftM(m,k){var p=m.split('-'),d=new Date(+p[0],+p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function dayLabel(s){
  if(s===todayStr)return 'დღეს';
  var y=new Date(now);y.setDate(y.getDate()-1);if(s===ymd(y))return 'გუშინ';
  var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return DAYS[d.getDay()]+', '+(+p[2])+' '+MONTHS[+p[1]-1].slice(0,3)+'.'+(+p[0]!==now.getFullYear()?' '+p[0]:'');
}
function totalBudget(){var t=0;for(var k in S.budgets)t+=+S.budgets[k]||0;return t}

function monthNav(){
  var atMax=ui.month>=curMonth;
  return '<div class="months"><button class="nav" data-act="prev" aria-label="წინა თვე"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></button>'+
  '<span class="label">'+mLabel(ui.month)+'</span>'+
  '<button class="nav" data-act="next" aria-label="შემდეგი თვე"'+(atMax?' disabled':'')+'><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 8 8-8 8"/></svg></button></div>';
}
function banner(){
  return S.demo?'<div class="banner"><span class="grow">ეს ნიმუშის მონაცემებია. გასუფთავების შემდეგ დაიწყე შენი ხარჯების შეყვანა.</span><button data-act="clearDemo">გასუფთავება</button></div>':'';
}


function applyRecurring(){
  var changed=false;
  (S.recurring||[]).forEach(function(r){
    r.done=r.done||[];
    for(var m=r.from;m<=curMonth;m=shiftM(m,1)){
      if(r.done.indexOf(m)>=0)continue;
      var p=m.split('-'),dim=new Date(+p[0],+p[1],0).getDate(),d=m+'-'+pad(Math.min(r.day,dim));
      if(d>todayStr)continue;
      S.expenses.push({id:uid(),amt:r.amt,cat:r.cat,note:r.note,date:d,type:'out',recurId:r.id});
      r.done.push(m);changed=true;
    }
  });
  if(changed)save();
}
function quickList(lim){
  var map={};
  S.expenses.forEach(function(e){
    if(e.type==='in'||e.loanId||e.recurId||!e.note)return;
    var k=e.note.toLowerCase(),o=map[k];
    if(!o)o=map[k]={note:e.note,cat:e.cat,amt:e.amt,date:e.date,n:0};
    o.n++;
    if(e.date>=o.date){o.date=e.date;o.cat=e.cat;o.amt=e.amt;o.note=e.note}
  });
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.n-a.n||(a.date<b.date?1:-1)}).slice(0,lim||8);
}
function quickHtml(s){
  if(s.editing||s.e.loanId||s.e.type==='in')return '';
  var q=quickList();if(!q.length)return '';
  return '<div class="quick">'+q.map(function(x,i){return '<button class="chip" data-act="quick" data-i="'+i+'">'+badge(cat(x.cat))+'<span class="qt">'+esc(x.note)+'</span></button>'}).join('')+'</div>';
}
function noteOpts(){return quickList(40).map(function(x){return '<option value="'+esc(x.note)+'">'}).join('')}
function backupAge(){
  if(!S.lastBackup)return 'ასლი ჯერ არ გაგიკეთებია.';
  var d=Math.floor((Date.now()-S.lastBackup)/864e5);return 'ბოლო ასლი: '+(d<1?'დღეს':d+' დღის წინ')+'.';
}
function backupBanner(){
  if(S.demo||!S.expenses.length)return '';
  var DAY=864e5,last=S.lastBackup||S.created||Date.now();
  if(Date.now()<(S.snooze||0)||Date.now()-last<30*DAY)return '';
  var d=Math.floor((Date.now()-last)/DAY);
  return '<div class="banner"><span class="grow">'+(S.lastBackup?'ბოლო ასლი '+d+' დღის წინ გააკეთე.':'ასლი ჯერ არ გაგიკეთებია.')+' შეინახე, რომ მონაცემები არ დაგეკარგოს.</span><button data-act="gobackup">ასლი</button><button data-act="snooze" style="color:var(--muted)">მოგვიანებით</button></div>';
}
function daysList(){
  var q=(ui.q||'').trim().toLowerCase(),src;
  if(q){src=S.expenses.filter(function(e){var cn=e.type==='in'?'შემოსავალი':cat(e.cat).n;return (e.note||'').toLowerCase().indexOf(q)>=0||cn.toLowerCase().indexOf(q)>=0||String(e.amt).indexOf(q)>=0})}
  else src=monthAll(ui.month);
  src=src.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)});
  if(!src.length)return q?'<div class="card empty"><b>ვერაფერი მოიძებნა</b>სცადე სხვა სიტყვა.</div>':'<div class="card empty"><b>ამ თვეში ჩანაწერი არ არის</b>დააჭირე ლურჯ ღილაკს და დაამატე ხარჯი.</div>';
  var h='';
  if(q)h+='<div class="section"><div class="daytitle"><span>ნაპოვნია '+src.length+'</span><span class="num">'+money(sum(src.filter(function(e){return e.type!=='in'})))+'</span></div></div>';
  var groups={},order=[];
  src.forEach(function(e){if(!groups[e.date]){groups[e.date]=[];order.push(e.date)}groups[e.date].push(e)});
  order.forEach(function(d){

    groups[d].forEach(function(e){
      if(e.type==='in'){
        h+='<button class="row" data-act="edit" data-id="'+e.id+'"><span class="dot" style="background:var(--good)"></span><span class="grow"><div class="t">'+esc(e.note||'შემოსავალი')+'</div><div class="sub">შემოსავალი</div></span><span class="amt num" style="color:var(--good)">+'+money(e.amt)+'</span></button>';
        return;
      }
      var c=cat(e.cat);
      h+='<button class="row'+(ui.flash===e.id?' flash':'')+'" data-act="edit" data-id="'+e.id+'">'+badge(c)+'<span class="grow"><div class="t">'+esc(e.note||c.n)+'</div><div class="sub">'+c.n+(e.recurId?' · განმეორებადი':'')+'</div></span><span class="amt num">−'+money(e.amt)+'</span></button>';
    });
    h+='</div></div>';

function vSum(){
  var list=monthExp(ui.month),spent=sum(list),inc=sum(monthInc(ui.month))||(+S.income||0),left=inc-spent,cc=byCat(list);

    '<div class="track">'+(seg||'')+'</div><div class="cap"><span>დახარჯულია '+(inc?Math.round(spent/inc*100):0)+'%</span><span class="num">'+(inc?'შემოსავალი '+money(inc):'შემოსავალი არ არის მითითებული')+'</span></div></div>'+
    '<div class="stats"><div><b class="num">'+money(spent)+'</b><span>ხარჯი</span></div><div><b class="num">'+money(avg)+'</b><span>საშუალოდ დღეში</span></div><div><b class="num">'+money(proj)+'</b><span>'+(isCur?'თვის პროგნოზი':'სულ')+'</span></div></div></div></div>';
  if(isCur&&inc&&proj>inc){h+='<div class="banner" style="background:color-mix(in srgb,var(--bad) 14%,var(--card))"><span class="grow">ამ ტემპით თვის ბოლოს '+money(proj-inc)+'-ით გადააჭარბებ შემოსავალს.</span></div>'}
  if(isCur&&inc){
    var dl=dim-now.getDate()+1,dcat=ui.dailyCat&&(+S.budgets[ui.dailyCat]||0)>0?cat(ui.dailyCat):null;

    var dchips='<button class="chip" data-act="dailycat" data-cat="" aria-pressed="'+!dcat+'">ყველა</button>';
    CATS.forEach(function(c){if(c.id==='loan'||!(+S.budgets[c.id]>0))return;dchips+='<button class="chip" data-act="dailycat" data-cat="'+c.id+'" aria-pressed="'+(!!dcat&&dcat.id===c.id)+'">'+badge(c)+'<span class="qt">'+c.n+'</span></button>'});
    h+='<div class="section"><div class="card"><div class="hero" style="padding:16px 16px 12px"><div class="k">დღეს დარჩა'+(dcat?' · '+dcat.n:'')+'</div><div class="big num'+(rest<0?' neg':'')+'" style="font-size:34px;margin:2px 0 12px">'+money(rest)+'</div>'+
      '<div class="track"><i style="width:'+(allow?Math.min(100,todaySp/allow*100):100)+'%;background:'+(rest<0?'var(--bad)':'var(--accent)')+'"></i></div>'+
      '<div class="cap"><span class="num">დღეს დახარჯულია '+money(todaySp)+'</span><span class="num">'+(dLeft<=0?(dcat?'ლიმიტი ამოიწურა':'თვის თანხა ამოიწურა'):'დღიური ლიმიტი '+money(allow))+'</span></div>'+

    crow.slice(0,4).forEach(function(r){h+='<div class="row">'+badge(r.c)+'<span class="grow t">'+r.c.n+'</span><span class="amt num" style="color:'+(r.d>0?'var(--bad)':'var(--good)')+'">'+(r.d>0?'+':'−')+money(Math.abs(r.d))+'</span></div>'});
    h+='</div></div>';
  }
  var top=list.slice().sort(function(a,b){return b.amt-a.amt}).slice(0,5);
  if(top.length){
    h+='<div class="section"><h2>ტოპ 5 ხარჯი</h2><div class="card">';
    top.forEach(function(e){
      var c=cat(e.cat),p=e.date.split('-');

    });
    h+='</div></div>';
  }
  h+='<div class="section"><h2>კატეგორიების მიხედვით</h2><div class="card">';
  var any=false;

      '<div class="catbar"><i style="width:'+pct+'%;background:'+(over?'var(--bad)':c.c)+'"></i></div>'+
      '<div class="sub num" style="margin-top:4px">'+(lim?'ლიმიტი '+money(lim)+' · '+(lim-v>=0?'დარჩა '+money(lim-v):'ზედმეტია '+money(v-lim)):Math.round(spent?v/spent*100:0)+'% ხარჯიდან')+'</div></div>';
  });
  if(!any)h+='<div class="empty">მონაცემები ჯერ არ არის</div>';
  return h+'</div></div>';
}

function loanById(id){return (S.loans||[]).filter(function(x){return x.id===id})[0]}
function loanStats(l){
  var rep=S.expenses.filter(function(e){return e.loanId===l.id}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  var paid=sum(rep),rem=Math.max(0,l.total-paid),monthly=l.total/(l.months||1);
  var paidM=sum(rep.filter(function(e){return e.date.slice(0,7)===curMonth}));
  return {rep:rep,paid:paid,rem:rem,monthly:monthly,due:Math.max(0,Math.min(rem,monthly-paidM)),pct:l.total?Math.min(100,paid/l.total*100):0};
}

      '<div class="row" style="display:block"><div class="track"><i style="width:'+st.pct+'%;background:var(--good)"></i></div>'+

      (done?'':'<div class="sub num" style="margin-top:4px">'+(st.due>0?'ამ თვეში გადასახდელია '+money(st.due):'ამ თვის ნორმა შესრულებულია')+'</div>')+'</div>';
    st.rep.slice(0,3).forEach(function(e){

  else{var d=ui.month===curMonth?todayStr:ui.month+'-01';ui.sheet={editing:false,focus:true,fresh:true,e:{amt:'',cat:'food',note:'',date:d,type:'out'}}}

function toast(t){ui.toast=t;render();setTimeout(function(){ui.toast=null;var b=document.getElementById('toastbox');if(b)b.remove()},1800)}
function num(v){return parseFloat(String(v).replace(/\s/g,'').replace(',','.'))}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){if(ui.tab!==t.dataset.tab)ui.anim='tab';ui.tab=t.dataset.tab;ui.confirmClear=false;render();window.scrollTo(0,0);return}
  var a=t.dataset.act;
  if(a==='closeSheet'){if(t.classList.contains('scrim')&&ev.target!==t)return;
    var sc=document.querySelector('.scrim');
    if(sc&&!sc.classList.contains('closing')){sc.classList.add('closing');setTimeout(function(){ui.sheet=null;ui.ls=null;render()},210)}
    else{ui.sheet=null;ui.ls=null;render()}
    return}
  if(a==='prev'){ui.anim='prev';ui.month=shiftM(ui.month,-1);render()}
  else if(a==='next'){if(ui.month<curMonth){ui.anim='next';ui.month=shiftM(ui.month,1);render()}}
  else if(a==='edit'){openSheet(t.dataset.id)}
  else if(a==='pick'){readSheet();var pk=t.dataset.cat;ui.sheet.e.type=pk==='income'?'in':'out';ui.sheet.e.cat=pk;render()}
  else if(a==='type'){readSheet();ui.sheet.e.type=t.dataset.type;render()}
  else if(a==='dailycat'){ui.dailyCat=t.dataset.cat||null;render()}
  else if(a==='quick'){var qi=quickList()[+t.dataset.i];if(qi){readSheet();var qe=ui.sheet.e;qe.note=qi.note;qe.cat=qi.cat;qe.amt=qi.amt;qe.type='out';render()}}
  else if(a==='gobackup'){ui.tab='plan';ui.anim='tab';render();window.scrollTo(0,document.body.scrollHeight)}
  else if(a==='snooze'){S.snooze=Date.now()+7*864e5;save();render()}
  else if(a==='newRecur'){ui.ls={kind:'recur',editing:false,fresh:true,focus:true,l:{amt:'',cat:'home',note:'',day:1}};render()}
  else if(a==='editRecur'){var Rr=(S.recurring||[]).filter(function(x){return x.id===t.dataset.id})[0];if(Rr){ui.ls={kind:'recur',editing:true,fresh:true,l:{id:Rr.id,amt:Rr.amt,cat:Rr.cat,note:Rr.note,day:Rr.day}};render()}}
  else if(a==='rcpick'){readLs();ui.ls.l.cat=t.dataset.cat;render()}
  else if(a==='saveRecur'){
    readLs();var rl=ui.ls.l,rm=num(rl.amt),dy=Math.min(31,Math.max(1,Math.round(num(rl.day))||1));
    if(!(rm>0)){var rai=document.getElementById('rc_amt');if(rai)rai.focus();return}
    var rn=(rl.note||'').trim(),late=false;S.recurring=S.recurring||[];
    if(ui.ls.editing){S.recurring=S.recurring.map(function(x){return x.id===rl.id?{id:x.id,amt:rm,cat:rl.cat,note:rn,day:dy,from:x.from,done:x.done||[]}:x})}
    else{late=dy<=now.getDate();S.recurring.push({id:uid(),amt:rm,cat:rl.cat,note:rn,day:dy,from:late?shiftM(curMonth,1):curMonth,done:[]})}
    ui.ls=null;applyRecurring();save();render();toast(late?'დაემატება შემდეგი თვიდან':'შენახულია');
  }
  else if(a==='delRecurAsk'){readLs();ui.ls.confirmDel=true;render()}
  else if(a==='delRecur'){var rid=ui.ls.l.id;S.recurring=S.recurring.filter(function(x){return x.id!==rid});ui.ls=null;save();render();toast('წაიშალა')}
  else if(a==='newLoan'){ui.ls={kind:'loan',editing:false,fresh:true,focus:true,l:{name:'',total:'',months:3}};render()}
  else if(a==='editLoan'){var Le=loanById(t.dataset.id);if(Le){ui.ls={kind:'loan',editing:true,fresh:true,l:{id:Le.id,name:Le.name,total:Le.total,months:Le.months}};render()}}
  else if(a==='repay'){
    var Lp=loanById(t.dataset.id);
    if(Lp){var sp=loanStats(Lp),sug=Math.round(Math.min(sp.due>0?sp.due:sp.monthly,sp.rem)*100)/100;
      ui.ls={kind:'repay',fresh:true,focus:true,loanId:Lp.id,amt:sug,date:todayStr};render()}
  }
  else if(a==='saveLoan'){
    readLs();var ll=ui.ls.l,tot=num(ll.total),mo=Math.round(num(ll.months))||0;
    if(!(tot>0)){var ti=document.getElementById('l_total');if(ti)ti.focus();return}
    if(mo<1)mo=1;
    var nm=(ll.name||'').trim()||'სესხი';
    S.loans=S.loans||[];
    if(ui.ls.editing){S.loans=S.loans.map(function(x){return x.id===ll.id?{id:ll.id,name:nm,total:tot,months:mo,date:x.date}:x})}
    else{S.loans.push({id:uid(),name:nm,total:tot,months:mo,date:todayStr})}
    ui.ls=null;save();render();toast('შენახულია');
  }
  else if(a==='delLoanAsk'){readLs();ui.ls.confirmDel=true;render()}
  else if(a==='delLoan'){var lid=ui.ls.l.id;S.loans=S.loans.filter(function(x){return x.id!==lid});ui.ls=null;save();render();toast('წაიშალა')}
  else if(a==='saveRepay'){
    readLs();var rs=ui.ls,rv=num(rs.amt),Lr=loanById(rs.loanId);
    if(!(rv>0)||!Lr){var ri=document.getElementById('r_amt');if(ri)ri.focus();return}
    S.expenses.push({id:uid(),amt:rv,cat:'loan',note:'სესხი: '+Lr.name,date:rs.date,type:'out',loanId:Lr.id});
    ui.ls=null;ui.month=rs.date.slice(0,7);save();render();toast('ჩარიცხვა დაემატა ხარჯებში');
  }
  else if(a==='newcat'){readSheet();ui.sheet.adding=true;ui.sheet.focusCat=true;render()}
  else if(a==='addcat'){
    var inp=document.getElementById('f_newcat'),nm=inp?inp.value.trim():'';
    if(!nm){if(inp)inp.focus();return}
    readSheet();
    S.customCats=S.customCats||[];
    var nc={id:'c'+uid(),n:nm,c:'var(--c'+(S.customCats.length%6)+')'};
    S.customCats.push(nc);syncCustom();
    ui.sheet.e.cat=nc.id;ui.sheet.e.type='out';ui.sheet.adding=false;save();render();
  }
  else if(a==='saveSheet'){
    readSheet();var e=ui.sheet.e,v=num(e.amt);
    if(!(v>0)){var f=document.getElementById('f_amt');if(f)f.focus();return}
    var rec={amt:v,cat:e.type==='in'?'income':e.cat,note:e.note.trim(),date:e.date,type:e.type};
    if(e.loanId){rec.loanId=e.loanId;rec.cat='loan'}
    if(ui.sheet.editing){rec.id=e.id;S.expenses=S.expenses.map(function(x){return x.id===e.id?rec:x})}
    else{rec.id=uid();S.expenses.push(rec)}
    ui.month=e.date.slice(0,7);ui.sheet=null;ui.flash=rec.id;save();render();setTimeout(function(){ui.flash=null},1700);toast('შენახულია');
  }
  else if(a==='delAsk'){readSheet();ui.confirmDel=true;render()}
  else if(a==='delete'){var id=ui.sheet.e.id;S.expenses=S.expenses.filter(function(x){return x.id!==id});ui.sheet=null;ui.confirmDel=false;save();render();toast('წაიშალა')}
  else if(a==='clearDemo'){S.expenses=[];S.demo=false;save();render()}
  else if(a==='clearAsk'){ui.confirmClear=true;render()}
  else if(a==='clearAll'){S={income:0,budgets:{},expenses:[],demo:false};ui.confirmClear=false;save();render();toast('მონაცემები წაიშალა')}
  else if(a==='export'){
    S.lastBackup=Date.now();save();
    var txt=JSON.stringify(S),box=document.getElementById('io');box.value=txt;box.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('ასლი გადაწერილია')},function(){toast('მონიშნე და გადაწერე ხელით')})}
    else toast('მონიშნე და გადაწერე ხელით');
  }
  else if(a==='import'){
    try{var o=JSON.parse(document.getElementById('io').value);if(!o||!Array.isArray(o.expenses))throw 0;o.demo=false;S=o;syncCustom();S.created=S.created||Date.now();applyRecurring();save();render();toast('აღდგენილია')}
    catch(e){toast('ასლი ვერ წაიკითხა')}
  }
});
document.getElementById('fab').addEventListener('click',function(){openSheet()});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.id==='f_newcat'){ev.preventDefault();var b=document.querySelector('[data-act="addcat"]');if(b)b.click()}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){
    ui.q=ev.target.value;var on=!!ui.q.trim();
    var ql=document.getElementById('dayslist');if(ql)ql.innerHTML=daysList();
    var qm=document.querySelector('#app .months');if(qm)qm.hidden=on;
    var qc=document.getElementById('daycards');if(qc)qc.hidden=on;
    return;
  }
  var b=ev.target.dataset&&ev.target.dataset.bind;if(!b)return;
  var v=num(ev.target.value)||0;
  if(b==='income')S.income=v;else S.budgets[b.slice(2)]=v;
  S.demo=S.demo;save();
  var f=document.getElementById('planfoot');if(f){var tb=totalBudget(),inc=+S.income||0;f.textContent=planFoot(tb,inc-tb,inc)}
});
document.addEventListener('change',function(ev){
  if(ev.target.id!=='f_note'||!ui.sheet||ui.sheet.editing||ui.sheet.e.loanId||ui.sheet.e.type==='in')return;
  var v=ev.target.value.trim().toLowerCase();if(!v)return;
  var m=quickList(999).filter(function(x){return x.note.toLowerCase()===v})[0];if(!m)return;
  ui.sheet.e.cat=m.cat;
  var a=document.getElementById('f_amt');if(a&&!a.value)a.value=m.amt;
  var bs=document.querySelectorAll('#modal [data-act="pick"]');
  for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',String(bs[i].dataset.cat===m.cat));
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&ymd(new Date())!==todayStr&&!ui.sheet&&!ui.ls)location.reload();
});
ui.anim='tab';render();
})();
</script>

</body></html>
