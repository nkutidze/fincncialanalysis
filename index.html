function sum(a){return a.reduce(function(t,e){return t+e.amt},0)}

function shiftM(m,k){var p=m.split('-'),d=new Date(+p[0],+p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function dayLabel(s){
  if(s===todayStr)return 'დღეს';
  var y=new Date(now);y.setDate(y.getDate()-1);if(s===ymd(y))return 'გუშინ';
  var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return DAYS[d.getDay()]+', '+(+p[2])+' '+MONTHS[+p[1]-1].slice(0,3)+'.'+(+p[0]!==now.getFullYear()?' '+p[0]:'');

function applyRecurring(){
  var changed=false;
  (S.recurring||[]).forEach(function(r){
    r.done=r.done||[];
    for(var m=r.from;m<=curMonth;m=shiftM(m,1)){
      if(r.done.indexOf(m)>=0)continue;
      var p=m.split('-'),dim=new Date(+p[0],+p[1],0).getDate(),d=m+'-'+pad(Math.min(r.day,dim));
      if(d>todayStr)continue;
      S.expenses.push({id:uid(),amt:r.amt,cat:r.cat,note:r.note,date:d,type:'out',recurId:r.id});
      r.done.push(m);changed=true;
    }
  });
  if(changed)save();
}
function quickList(lim){
  var map={};
  S.expenses.forEach(function(e){
    if(e.type==='in'||e.loanId||e.recurId||!e.note)return;
    var k=e.note.toLowerCase(),o=map[k];
    if(!o)o=map[k]={note:e.note,cat:e.cat,amt:e.amt,date:e.date,n:0};
    o.n++;
    if(e.date>=o.date){o.date=e.date;o.cat=e.cat;o.amt=e.amt;o.note=e.note}
  });
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.n-a.n||(a.date<b.date?1:-1)}).slice(0,lim||8);
}

function shortNum(v){return Math.round(v).toLocaleString('en-US').replace(/,/g,' ')}

function monthRange(){
  var min=curMonth;
  S.expenses.forEach(function(e){var m=e.date.slice(0,7);if(m<min)min=m});
  var a=[],m=min;
  while(m<=curMonth){a.push(m);m=shiftM(m,1)}
  while(a.length<6)a.unshift(shiftM(a[0],-1));
  if(a.length>36)a=a.slice(-36);
  return a;
}
function barChart(items,color){
  var step=56,bw=30,H=182,base=138,top=28,W=step*items.length,max=1,sel=-1;
  items.forEach(function(x,i){if(x.v>max)max=x.v;if(x.m===ui.month)sel=i});
  var s='<div class="chartscroll" data-sel="'+sel+'" data-step="'+step+'"><svg class="chart" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="თვეების დინამიკა"><line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>';
  items.forEach(function(it,i){
    var x=step*i+(step-bw)/2,h=it.v>0?Math.max(3,(base-top)*it.v/max):0,y=base-h,isel=it.m===ui.month,mo=it.m.slice(5);
    s+='<g data-act="pickmonth" data-m="'+it.m+'" style="cursor:pointer"><rect x="'+(step*i)+'" y="0" width="'+step+'" height="'+H+'" fill="transparent"/>'+
      (h?'<rect class="bar" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="7" fill="'+color+'" fill-opacity="'+(isel?1:.3)+'" style="animation-delay:'+(Math.min(i,8)*70)+'ms"/>':'')+
      '<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle"'+(isel?' class="sel"':'')+'>'+(it.v>0?shortNum(it.v):'')+'</text>'+
      '<text x="'+(x+bw/2)+'" y="'+(base+19)+'" text-anchor="middle"'+(isel?' class="sel"':'')+'>'+MONTHS[+mo-1].slice(0,3)+'</text>'+
      ((mo==='01'||i===0)?'<text x="'+(x+bw/2)+'" y="'+(base+35)+'" text-anchor="middle">'+it.m.slice(0,4)+'</text>':'')+'</g>';
  });
  return s+'</svg></div>';
}

function mccCat(c){
  c=+c;
  if(c===4215||c===5411||c===5499||c===5441||c===5422||c===5451||c===5462||(c>=5811&&c<=5814)||c===5921)return 'food';
  if(c===4111||c===4112||c===4121||c===4131||c===4789||c===5541||c===5542||c===7523||c===7512||c===7519)return 'transport';
  if(c===4814||c===4816||c===4899||c===4900)return 'home';
  if(c===5912||c===5122||c===5047||c===5975||c===5976||(c>=8011&&c<=8099))return 'health';
  if(c===7832||c===7922||c===7929||c===7941||(c>=7991&&c<=7999)||c===4722||c===7011||c===4511)return 'fun';
  if((c>=5600&&c<=5699)||c===5311||c===5732||c===5734||c===5735||c===5942||c===5943||c===5944||c===5945||c===5947||c===5948||c===5970||c===5977||c===5992||c===5999||c===5039||c===5200||c===5211||c===5231||c===5712||c===5719||c===5722)return 'shop';
  return 'other';
}
function bankClassify(d,amt,owner){
  var head=d.split(' - ')[0].trim();
  if(amt<0){
    if(head==='გადახდა'){
      if(/ვალუტის გაცვლითი|კონვერტაცია/.test(d))return {g:'fx',cat:'other',note:'ვალუტის გაცვლა'};
      var mc=(d.match(/MCC:(\d+)/)||[])[1];
      if(mc){var mm=(d.match(/ობიექტი:\s*([^,;]+)/)||[])[1];return {g:'card',cat:mccCat(mc),note:(mm||'ბარათით გადახდა').trim()}}
      if(/საკომისიო/.test(d))return {g:'pay',cat:'other',note:'საკომისიო'};
      var pn=(d.match(/;\s*გადახდა,\s*[\d\/ ]+,\s*([^,]+)/)||[])[1];
      return {g:'pay',cat:/ინტერნეტ|ტელეფ|მობილ|კომუნ|წყალ|გაზ|ელექტრ|მაგთ|სილქნეტ|ენერგო|ნაგავ|ქსელ/i.test(d)?'home':'other',note:(pn||'გადახდა').trim()};
    }
    if(head==='განაღდება')return {g:'cash',cat:'other',note:'განაღდება'};
    if(head==='საკომისიოს გადახდა')return {g:'pay',cat:'other',note:'საკომისიო'};
    if(head==='გადარიცხვა'){
      var rc=((d.match(/მიმღები:\s*([^;]+)/)||[])[1]||'').trim();
      if(owner&&rc===owner)return {g:'self',cat:'other',note:'საკუთარ ანგარიშზე'};
      return {g:'xfer',cat:'other',note:'გადარიცხვა'+(rc?': '+rc:'')};
    }
    return {g:'pay',cat:'other',note:head.slice(0,40)};
  }
  if(/დაბრუნება/.test(d))return {g:'refund',note:'თანხის დაბრუნება'};
  var sn=((d.match(/გადმომრიცხავი:\s*([^;]+)/)||[])[1]||'').trim();
  if(owner&&sn===owner)return {g:'self',note:'საკუთარი ანგარიშიდან'};
  if(/^(შპს|სს|ი\/მ|შპს\.)/.test(sn))return {g:'in_co',note:sn};
  return {g:'in_pp',note:sn||'ჩარიცხვა'};
}
function parseStatement(wb){
  var owner='',rows=null;
  wb.SheetNames.forEach(function(n){
    var r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}),found=false;
    for(var i=0;i<Math.min(r.length,6);i++){var x=r[i]||[];if(String(x[0]||'').trim()==='თარიღი'&&String(x[1]||'').trim()==='დანიშნულება'){found=true;break}}
    if(found){rows=r;return}
    r.forEach(function(x){if(x&&String(x[0]||'').indexOf('ანგარიშის მფლობელი')===0)owner=String(x[2]||'').trim()});
  });
  if(!rows)return null;
  var have={};S.expenses.forEach(function(e){if(e.bid)have[e.bid]=1});
  var seen={},items=[],from='9999',to='0000';
  rows.forEach(function(r){
    if(!r)return;
    var a=String(r[0]||'').trim(),m=a.match(/^(\d\d)\/(\d\d)\/(\d{4})$/);
    if(!m||r[3]===null||r[3]===undefined||r[3]==='')return;
    var amt=parseFloat(r[3]);if(!amt)return;
    var d=String(r[1]||''),date=m[3]+'-'+m[2]+'-'+m[1];
    var t=d.match(/თარიღი:\s*(\d\d)\/(\d\d)\/(\d{4})/);if(t)date=t[3]+'-'+t[2]+'-'+t[1];
    var c=bankClassify(d,amt,owner),base=date+'|'+amt+'|'+d.replace(/\s+/g,' ').slice(0,140);
    seen[base]=(seen[base]||0)+1;var bid=base+'|'+seen[base];
    items.push({bid:bid,date:date,amt:Math.abs(amt),kind:amt<0?'out':'in',cat:c.cat||'other',note:c.note,g:c.g,dup:!!have[bid]});
    if(date<from)from=date;if(date>to)to=date;
  });
  return {items:items,owner:owner,from:from,to:to};
}

    });
    var bm=(blast||todayStr).slice(0,7);ui.month=bm<=curMonth?bm:curMonth;
    ui.ls=null;ui.tab='days';ui.anim='tab';save();render();toast('დაემატა '+bsel.length+' ჩანაწერი');
  }
  else if(a==='togglesearch'){
    if(ui.searchOpen||(ui.q||'').trim()){ui.searchOpen=false;ui.q=''}
    else{ui.searchOpen=true;ui.focusQ=true}
    render();
    var qf=document.getElementById('q');if(qf&&ui.focusQ){try{qf.focus()}catch(e){}}ui.focusQ=false;
  }
  else if(a==='sumview'){if((ui.sumView||'out')!==t.dataset.v){ui.sumView=t.dataset.v;ui.chartScroll=undefined;render()}}
  else if(a==='pickmonth'){if(t.dataset.m!==ui.month){var pcs=document.querySelector('.chartscroll');ui.chartScroll=pcs?pcs.scrollLeft:undefined;ui.month=t.dataset.m;render()}}
  else if(a==='incsrc'){var iks=incKeys(),ii=+t.dataset.i;ui.incSrc=ii<0?'ALL':iks[ii];var ics=document.querySelector('.chartscroll');ui.chartScroll=ics?ics.scrollLeft:undefined;render()}
  else if(a==='dailycat'){ui.dailyCat=t.dataset.cat||null;render()}
  else if(a==='quick'){var qi=quickList()[+t.dataset.i];if(qi){readSheet();var qe=ui.sheet.e;qe.note=qi.note;qe.cat=qi.cat;qe.amt=qi.amt;qe.type='out';render()}}
  else if(a==='gobackup'){ui.tab='plan';ui.anim='tab';render();window.scrollTo(0,document.body.scrollHeight)}
  else if(a==='snooze'){S.snooze=Date.now()+7*864e5;save();render()}
  else if(a==='newRecur'){ui.ls={kind:'recur',editing:false,fresh:true,focus:true,l:{amt:'',cat:'home',note:'',day:1}};render()}
  else if(a==='editRecur'){var Rr=(S.recurring||[]).filter(function(x){return x.id===t.dataset.id})[0];if(Rr){ui.ls={kind:'recur',editing:true,fresh:true,l:{id:Rr.id,amt:Rr.amt,cat:Rr.cat,note:Rr.note,day:Rr.day}};render()}}
  else if(a==='rcpick'){readLs();ui.ls.l.cat=t.dataset.cat;render()}
  else if(a==='saveRecur'){
    readLs();var rl=ui.ls.l,rm=num(rl.amt),dy=Math.min(31,Math.max(1,Math.round(num(rl.day))||1));
    if(!(rm>0)){var rai=document.getElementById('rc_amt');if(rai)rai.focus();return}
    var rn=(rl.note||'').trim(),late=false;S.recurring=S.recurring||[];
    if(ui.ls.editing){S.recurring=S.recurring.map(function(x){return x.id===rl.id?{id:x.id,amt:rm,cat:rl.cat,note:rn,day:dy,from:x.from,done:x.done||[]}:x})}
    else{late=dy<=now.getDate();S.recurring.push({id:uid(),amt:rm,cat:rl.cat,note:rn,day:dy,from:late?shiftM(curMonth,1):curMonth,done:[]})}
    ui.ls=null;applyRecurring();save();render();toast(late?'დაემატება შემდეგი თვიდან':'შენახულია');
  }
  else if(a==='delRecurAsk'){readLs();ui.ls.confirmDel=true;render()}
  else if(a==='delRecur'){var rid=ui.ls.l.id;S.recurring=S.recurring.filter(function(x){return x.id!==rid});ui.ls=null;save();render();toast('წაიშალა')}
  else if(a==='newLoan'){ui.ls={kind:'loan',editing:false,fresh:true,focus:true,l:{name:'',total:'',months:3}};render()}
  else if(a==='editLoan'){var Le=loanById(t.dataset.id);if(Le){ui.ls={kind:'loan',editing:true,fresh:true,l:{id:Le.id,name:Le.name,total:Le.total,months:Le.months}};render()}}
  else if(a==='repay'){
    var Lp=loanById(t.dataset.id);
    if(Lp){var sp=loanStats(Lp),sug=Math.round(Math.min(sp.due>0?sp.due:sp.monthly,sp.rem)*100)/100;
      ui.ls={kind:'repay',fresh:true,focus:true,loanId:Lp.id,amt:sug,date:todayStr};render()}
  }
  else if(a==='saveLoan'){
    readLs();var ll=ui.ls.l,tot=num(ll.total),mo=Math.round(num(ll.months))||0;
    if(!(tot>0)){var ti=document.getElementById('l_total');if(ti)ti.focus();return}
    if(mo<1)mo=1;
    var nm=(ll.name||'').trim()||'სესხი';
    S.loans=S.loans||[];
    if(ui.ls.editing){S.loans=S.loans.map(function(x){return x.id===ll.id?{id:ll.id,name:nm,total:tot,months:mo,date:x.date}:x})}
    else{S.loans.push({id:uid(),name:nm,total:tot,months:mo,date:todayStr})}
    ui.ls=null;save();render();toast('შენახულია');
  }
  else if(a==='delLoanAsk'){readLs();ui.ls.confirmDel=true;render()}
  else if(a==='delLoan'){var lid=ui.ls.l.id;S.loans=S.loans.filter(function(x){return x.id!==lid});ui.ls=null;save();render();toast('წაიშალა')}
  else if(a==='saveRepay'){
    readLs();var rs=ui.ls,rv=num(rs.amt),Lr=loanById(rs.loanId);
    if(!(rv>0)||!Lr){var ri=document.getElementById('r_amt');if(ri)ri.focus();return}
    S.expenses.push({id:uid(),amt:rv,cat:'loan',note:'სესხი: '+Lr.name,date:rs.date,type:'out',loanId:Lr.id});
    ui.ls=null;ui.month=rs.date.slice(0,7);save();render();toast('ჩარიცხვა დაემატა ხარჯებში');
  }
  else if(a==='newcat'){readSheet();ui.sheet.adding=true;ui.sheet.focusCat=true;render()}
  else if(a==='addcat'){
    var inp=document.getElementById('f_newcat'),nm=inp?inp.value.trim():'';
    if(!nm){if(inp)inp.focus();return}
    readSheet();
    S.customCats=S.customCats||[];
    var nc={id:'c'+uid(),n:nm,c:'var(--c'+(S.customCats.length%6)+')'};
    S.customCats.push(nc);syncCustom();
    ui.sheet.e.cat=nc.id;ui.sheet.e.type='out';ui.sheet.adding=false;save();render();
  }
  else if(a==='saveSheet'){
    readSheet();var e=ui.sheet.e,v=num(e.amt);
    if(!(v>0)){var f=document.getElementById('f_amt');if(f)f.focus();return}
    var rec={amt:v,cat:e.type==='in'?'income':e.cat,note:e.note.trim(),date:e.date,type:e.type};
    if(e.loanId){rec.loanId=e.loanId;rec.cat='loan'}
    if(ui.sheet.editing){rec.id=e.id;S.expenses=S.expenses.map(function(x){return x.id===e.id?rec:x})}
    else{rec.id=uid();S.expenses.push(rec)}
    ui.month=e.date.slice(0,7);ui.sheet=null;ui.flash=rec.id;save();render();setTimeout(function(){ui.flash=null},1700);toast('შენახულია');
  }
  else if(a==='delAsk'){readSheet();ui.confirmDel=true;render()}
  else if(a==='delete'){var id=ui.sheet.e.id;S.expenses=S.expenses.filter(function(x){return x.id!==id});ui.sheet=null;ui.confirmDel=false;save();render();toast('წაიშალა')}
  else if(a==='clearDemo'){S.expenses=[];S.demo=false;save();render()}
  else if(a==='exportfile'){
    S.lastBackup=Date.now();save();
    var tx=JSON.stringify(S),fn='finance-backup-'+todayStr+'.json',done=false;
    try{
      var file=new File([tx],fn,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});done=true}
    }catch(e){}
    if(!done){
      try{
        var bu=URL.createObjectURL(new Blob([tx],{type:'application/json'})),la=document.createElement('a');
        la.href=bu;la.download=fn;document.body.appendChild(la);la.click();la.remove();
        setTimeout(function(){URL.revokeObjectURL(bu)},4000);done=true;toast('ფაილი ჩამოიტვირთა');
      }catch(e){}
    }
    if(!done){
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){toast('ფაილის ჩამოტვირთვა აქ შეუძლებელია, ტექსტი დაკოპირდა')},function(){toast('გადმოწერა ამ გვერდზე ვერ მოხერხდა')})}
      else toast('გადმოწერა ამ გვერდზე ვერ მოხერხდა');
    }
  }
});
document.getElementById('fab').addEventListener('click',function(){openSheet()});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.id==='f_newcat'){ev.preventDefault();var b=document.querySelector('[data-act="addcat"]');if(b)b.click()}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){
    ui.q=ev.target.value;var on=!!ui.q.trim();
    var ql=document.getElementById('dayslist');if(ql)ql.innerHTML=daysList();
    var qm=document.querySelector('#app .monthpill');if(qm)qm.hidden=on;
    var qc=document.getElementById('daycards');if(qc)qc.hidden=on;
    return;
  }
  var b=ev.target.dataset&&ev.target.dataset.bind;if(!b)return;
  var v=num(ev.target.value)||0;
  S.budgets[b.slice(2)]=v;
  S.demo=S.demo;save();
  var f=document.getElementById('planfoot');if(f){var tb=totalBudget(),inc=sum(monthInc(curMonth));f.textContent=planFoot(tb,inc-tb,inc)}
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='bankfile'){
    var bf=ev.target.files&&ev.target.files[0];if(!bf)return;
    var rd=new FileReader();
    rd.onload=function(){
      loadXlsx(function(){
        try{
          var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'}),res=parseStatement(wb);
          if(!res||!res.items.length){toast('ამონაწერის ფორმატი ვერ ამოვიცანი');return}
          var on={};BGROUPS.forEach(function(g){on[g[0]]=g[2]});
          ui.ls={kind:'bank',fresh:true,items:res.items,on:on,from:res.from,to:res.to,owner:res.owner};render();
        }catch(e){toast('ფაილი ვერ წაიკითხა')}
      },function(){toast('ბიბლიოთეკა ვერ ჩაიტვირთა, შეამოწმე ინტერნეტი')});
    };
    rd.onerror=function(){toast('ფაილი ვერ წაიკითხა')};
    rd.readAsArrayBuffer(bf);
    return;
  }
  if(ev.target.dataset&&ev.target.dataset.grp&&ui.ls&&ui.ls.kind==='bank'){ui.ls.on[ev.target.dataset.grp]=ev.target.checked;render();return}
  if(ev.target.id==='importfile'){
    var pf=ev.target.files&&ev.target.files[0];if(!pf)return;
    var fr=new FileReader();fr.onload=function(){doImport(String(fr.result))};fr.onerror=function(){toast('ფაილი ვერ წაიკითხა')};fr.readAsText(pf);
    return;
  }
  if(ev.target.id!=='f_note'||!ui.sheet||ui.sheet.editing||ui.sheet.e.loanId||ui.sheet.e.type==='in')return;
  var v=ev.target.value.trim().toLowerCase();if(!v)return;
  var m=quickList(999).filter(function(x){return x.note.toLowerCase()===v})[0];if(!m)return;
  ui.sheet.e.cat=m.cat;
  var a=document.getElementById('f_amt');if(a&&!a.value)a.value=m.amt;
  var bs=document.querySelectorAll('#modal [data-act="pick"]');
  for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',String(bs[i].dataset.cat===m.cat));
});
document.addEventListener('scroll',function(ev){
  var t=ev.target;if(t&&t.classList&&t.classList.contains('chartscroll'))ui.chartScroll=t.scrollLeft;
},true);
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&ymd(new Date())!==todayStr&&!ui.sheet&&!ui.ls)location.reload();
});
render();
})();
</script>

</body></html>
