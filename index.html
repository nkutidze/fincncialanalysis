<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ჩემი ფინანსები</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS grouped-list app. Large title, month switcher, inset cards, floating tab bar, bottom sheet for entry. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fg:#000000; --muted:#8e8e93; --line:rgba(60,60,67,.16);
  --accent:#007aff; --accent-fg:#ffffff; --fill:rgba(118,118,128,.12);
  --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --bar:rgba(249,249,249,.86);
  --c0:#ff9500; --c1:#32ade6; --c2:#5856d6; --c3:#af52de; --c4:#ff2d55; --c5:#30b0c7; --c6:#8e8e93;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans Georgian","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fg:#ffffff; --muted:#8e8e93; --line:rgba(84,84,88,.55);
  --accent:#0a84ff; --fill:rgba(118,118,128,.24); --good:#30d158; --warn:#ff9f0a; --bad:#ff453a; --bar:rgba(28,28,30,.86);
  --c0:#ff9f0a; --c1:#64d2ff; --c2:#7d7aff; --c3:#bf5af2; --c4:#ff375f; --c5:#40c8e0; --c6:#98989d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fg:#ffffff; --muted:#8e8e93; --line:rgba(84,84,88,.55);
  --accent:#0a84ff; --fill:rgba(118,118,128,.24); --good:#30d158; --warn:#ff9f0a; --bad:#ff453a; --bar:rgba(28,28,30,.86);
  --c0:#ff9f0a; --c1:#64d2ff; --c2:#7d7aff; --c3:#bf5af2; --c4:#ff375f; --c5:#40c8e0; --c6:#98989d; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.3;
  padding-block:8px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--fg);font-size:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:14px 0 4px}
.months{display:flex;align-items:center;gap:4px;margin:0 0 16px;color:var(--muted)}
.months .label{color:var(--accent);font-size:17px;min-width:0;flex:0 1 auto;padding:6px 4px}
.months button.nav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.months button.nav:active{background:var(--fill)}
.months button.nav[disabled]{opacity:.3}

.card{background:var(--card);border-radius:14px;overflow:hidden}
.section{margin:0 0 22px}
.section>h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 6px 16px}
.section>.foot{font-size:13px;color:var(--muted);margin:6px 16px 0}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
button.row:active{background:var(--fill)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted)}
.amt{font-weight:500;white-space:nowrap}

.hero{padding:20px 16px 18px}
.hero .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 14px}
.hero .big.neg{color:var(--bad)}
.track{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.hero .cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:.5px solid var(--line)}
.stats div{padding:12px 16px;min-width:0}
.stats div+div{border-left:.5px solid var(--line)}
.stats b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:12px;color:var(--muted)}

.daytitle{display:flex;justify-content:space-between;margin:0 16px 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.catbar{height:6px;border-radius:3px;background:var(--fill);margin-top:7px;overflow:hidden}
.catbar i{display:block;height:100%;border-radius:3px}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--fill);color:var(--muted)}
.pill.over{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

.empty{padding:36px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.banner{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--warn) 16%,var(--card));border-radius:14px;padding:12px 16px;margin:0 0 16px;font-size:15px}
.banner button{color:var(--accent);font-weight:600;white-space:nowrap}

.field{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:48px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.field label{flex:1;min-width:0}
.field input{background:none;border:0;text-align:right;width:120px;min-width:0;padding:6px 0;outline:none}
.field input::placeholder{color:var(--muted)}
.field .unit{color:var(--muted)}
textarea.io{width:100%;min-height:90px;background:var(--fill);border:0;border-radius:10px;padding:10px 12px;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.plain{background:var(--card);color:var(--accent);font-weight:500}
.btn.danger{background:var(--card);color:var(--bad);font-weight:500}
.btn:active{opacity:.7}
.stack{display:flex;flex-direction:column;gap:10px;padding:12px 16px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:10.5px;font-weight:500}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 6px));
  bottom:calc(68px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,122,255,.35)}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheethead b{font-size:17px;font-weight:600}
.sheethead button{color:var(--accent);padding:6px 2px}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:18px 0 22px}
.amount input{width:100%;max-width:240px;background:none;border:0;outline:none;text-align:center;font-size:52px;font-weight:700;letter-spacing:-.02em;padding:0}
.amount input::placeholder{color:var(--fill)}
.amount span{font-size:28px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:18px;background:var(--fill);font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip .ic{width:22px;height:22px}
.chip .ic svg{width:13px;height:13px}
.chip[aria-pressed="true"] .ic{background:#fff!important;color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabbar" aria-label="ნავიგაცია"><div class="in" id="tabs"></div></nav>
<button class="fab" id="fab" aria-label="ხარჯის დამატება"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="modal"></div>

<script>
(function(){
var KEY='finance.v1';
var CATS=[
  {id:'food',n:'საკვები',c:'var(--c0)',i:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 2-3 4.5-3 8h3"/>'},
  {id:'transport',n:'ტრანსპორტი',c:'var(--c1)',i:'<rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 11h16M8 20v-3M16 20v-3"/>'},
  {id:'home',n:'ბინა და კომუნალური',c:'var(--c2)',i:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'},
  {id:'fun',n:'გართობა',c:'var(--c3)',i:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>'},
  {id:'health',n:'ჯანმრთელობა',c:'var(--c4)',i:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>'},
  {id:'shop',n:'ტანსაცმელი და შოპინგი',c:'var(--c5)',i:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/>'},
  {id:'other',n:'სხვა',c:'var(--c6)',i:'<circle cx="6" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="18" cy="12" r="1.2" fill="currentColor"/>'}];
function badge(c){return '<span class="ic" style="background:'+c.c+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+c.i+'</svg></span>'}
var MONTHS=['იანვარი','თებერვალი','მარტი','აპრილი','მაისი','ივნისი','ივლისი','აგვისტო','სექტემბერი','ოქტომბერი','ნოემბერი','დეკემბერი'];
var DAYS=['კვირა','ორშაბათი','სამშაბათი','ოთხშაბათი','ხუთშაბათი','პარასკევი','შაბათი'];
var TABS=[
 {id:'days',n:'ხარჯები',i:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/>'},
 {id:'sum',n:'მიმოხილვა',i:'<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'},
 {id:'plan',n:'გეგმა',i:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/>'}];

function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2}).replace(/,/g,' ')+' ₾'}
function cat(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return CATS[6]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

var now=new Date(), todayStr=ymd(now), curMonth=todayStr.slice(0,7);
var S=load();
function syncCustom(){(S.customCats||[]).forEach(function(c){if(!CATS.some(function(x){return x.id===c.id})){CATS.push({id:c.id,n:c.n,c:c.c,i:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2" fill="currentColor"/>'})}})}
syncCustom();
var ui={tab:'days',month:curMonth,sheet:null,toast:null,confirmDel:false,confirmClear:false};

function demo(){
  var y=now.getFullYear(),m=now.getMonth(),d=now.getDate(),ex=[];
  var items=[['food',24.5,'სუპერმარკეტი'],['transport',2.5,'მეტრო'],['food',12,'ყავა და სენდვიჩი'],['home',140,'კომუნალური'],['fun',35,'კინო'],['health',48,'აფთიაქი'],['food',68.4,'ყოველკვირეული ბაზარი'],['shop',120,'ზამთრის ქურთუკი'],['transport',18,'ტაქსი'],['food',9.8,'სადილი'],['other',20,'საჩუქარი']];
  for(var i=0;i<items.length;i++){
    var day=Math.max(1,d-Math.floor(i*d/items.length));
    ex.push({id:uid()+i,amt:items[i][1],cat:items[i][0],note:items[i][2],date:y+'-'+pad(m+1)+'-'+pad(day)});
  }
  return {income:2800,budgets:{food:600,transport:150,home:400,fun:200,health:150,shop:300,other:150},expenses:ex,demo:true};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.expenses)return o}}catch(e){}
  return demo();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function monthAll(m){return S.expenses.filter(function(e){return e.date.slice(0,7)===m})}
function monthExp(m){return monthAll(m).filter(function(e){return e.type!=='in'})}
function monthInc(m){return monthAll(m).filter(function(e){return e.type==='in'})}
function sum(a){return a.reduce(function(t,e){return t+e.amt},0)}
function byCat(list){var o={};list.forEach(function(e){o[e.cat]=(o[e.cat]||0)+e.amt});return o}
function mLabel(m){var p=m.split('-');return MONTHS[+p[1]-1]+' '+p[0]}
function shiftM(m,k){var p=m.split('-'),d=new Date(+p[0],+p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function dayLabel(s){
  if(s===todayStr)return 'დღეს';
  var y=new Date(now);y.setDate(y.getDate()-1);if(s===ymd(y))return 'გუშინ';
  var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return DAYS[d.getDay()]+', '+(+p[2])+' '+MONTHS[+p[1]-1].slice(0,3)+'.';
}
function totalBudget(){var t=0;for(var k in S.budgets)t+=+S.budgets[k]||0;return t}

function monthNav(){
  var atMax=ui.month>=curMonth;
  return '<div class="months"><button class="nav" data-act="prev" aria-label="წინა თვე"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></button>'+
  '<span class="label">'+mLabel(ui.month)+'</span>'+
  '<button class="nav" data-act="next" aria-label="შემდეგი თვე"'+(atMax?' disabled':'')+'><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 8 8-8 8"/></svg></button></div>';
}
function banner(){
  return S.demo?'<div class="banner"><span class="grow">ეს ნიმუშის მონაცემებია. გასუფთავების შემდეგ დაიწყე შენი ხარჯების შეყვანა.</span><button data-act="clearDemo">გასუფთავება</button></div>':'';
}

function vDays(){
  var all=monthAll(ui.month).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)});
  var list=all.filter(function(e){return e.type!=='in'}),incM=sum(monthInc(ui.month));
  var h='<h1>ხარჯები</h1>'+monthNav()+banner();
  if(!all.length){
    return h+'<div class="card empty"><b>ამ თვეში ჩანაწერი არ არის</b>დააჭირე ლურჯ ღილაკს და დაამატე ხარჯი ან შემოსავალი.</div>';
  }
  var isCurM=ui.month===curMonth,dayV,dayK;
  if(isCurM){dayV=sum(list.filter(function(e){return e.date===todayStr}));dayK='დღეს დახარჯული'}
  else{var pp=ui.month.split('-'),dd=new Date(+pp[0],+pp[1],0).getDate();dayV=sum(list)/dd;dayK='საშუალოდ დღეში'}
  h+='<div class="section" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
    '<div class="card" style="padding:16px;min-width:0"><div style="font-size:13px;color:var(--muted)">'+dayK+'</div><div class="num" style="font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+money(dayV)+'</div></div>'+
    '<div class="card" style="padding:16px;min-width:0"><div style="font-size:13px;color:var(--muted)">თვეში დახარჯული</div><div class="num" style="font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+money(sum(list))+'</div>'+((incM+(+S.income||0))?'<div class="num" style="font-size:13px;color:var(--good);margin-top:2px">შემოსავალი +'+money(incM+(+S.income||0))+'</div>':'')+'</div></div>';
  var groups={},order=[];
  all.forEach(function(e){if(!groups[e.date]){groups[e.date]=[];order.push(e.date)}groups[e.date].push(e)});
  order.forEach(function(d){
    var dsp=sum(groups[d].filter(function(e){return e.type!=='in'}));
    h+='<div class="section"><div class="daytitle"><span>'+dayLabel(d)+'</span><span class="num">'+(dsp?money(dsp):'')+'</span></div><div class="card">';
    groups[d].forEach(function(e){
      if(e.type==='in'){
        h+='<button class="row" data-act="edit" data-id="'+e.id+'"><span class="dot" style="background:var(--good)"></span><span class="grow"><div class="t">'+esc(e.note||'შემოსავალი')+'</div><div class="sub">შემოსავალი</div></span><span class="amt num" style="color:var(--good)">+'+money(e.amt)+'</span></button>';
        return;
      }
      var c=cat(e.cat);
      h+='<button class="row" data-act="edit" data-id="'+e.id+'">'+badge(c)+'<span class="grow"><div class="t">'+esc(e.note||c.n)+'</div><div class="sub">'+c.n+'</div></span><span class="amt num">−'+money(e.amt)+'</span></button>';
    });
    h+='</div></div>';
  });
  return h;
}

function vSum(){
  var list=monthExp(ui.month),spent=sum(list),inc=(+S.income||0)+sum(monthInc(ui.month)),left=inc-spent,cc=byCat(list);
  var isCur=ui.month===curMonth,p=ui.month.split('-'),dim=new Date(+p[0],+p[1],0).getDate();
  var elapsed=isCur?now.getDate():(ui.month<curMonth?dim:0);
  var avg=elapsed?spent/elapsed:0,proj=isCur?avg*dim:spent;
  var h='<h1>მიმოხილვა</h1>'+monthNav()+banner();
  var seg='';CATS.forEach(function(c){if(cc[c.id]){seg+='<i style="width:'+(spent?cc[c.id]/spent*100:0)+'%;background:'+c.c+'"></i>'}});
  h+='<div class="section"><div class="card"><div class="hero"><div class="k">დარჩენილი</div><div class="big num'+(left<0?' neg':'')+'">'+money(left)+'</div>'+
    '<div class="track">'+(seg||'')+'</div><div class="cap"><span>დახარჯულია '+(inc?Math.round(spent/inc*100):0)+'%</span><span class="num">'+(inc?'შემოსავალი '+money(inc):'შემოსავალი არ არის მითითებული')+'</span></div></div>'+
    '<div class="stats"><div><b class="num">'+money(spent)+'</b><span>ხარჯი</span></div><div><b class="num">'+money(avg)+'</b><span>საშუალოდ დღეში</span></div><div><b class="num">'+money(proj)+'</b><span>'+(isCur?'თვის პროგნოზი':'სულ')+'</span></div></div></div></div>';
  if(isCur&&inc&&proj>inc){h+='<div class="banner" style="background:color-mix(in srgb,var(--bad) 14%,var(--card))"><span class="grow">ამ ტემპით თვის ბოლოს '+money(proj-inc)+'-ით გადააჭარბებ შემოსავალს.</span></div>'}
  h+='<div class="section"><h2>კატეგორიების მიხედვით</h2><div class="card">';
  var any=false;
  CATS.slice().sort(function(a,b){return (cc[b.id]||0)-(cc[a.id]||0)}).forEach(function(c){
    var v=cc[c.id]||0,lim=+S.budgets[c.id]||0;if(!v&&!lim)return;any=true;
    var pct=lim?Math.min(100,v/lim*100):(spent?v/spent*100:0),over=lim&&v>lim;
    h+='<div class="row" style="align-items:stretch;flex-direction:column;gap:0"><div style="display:flex;align-items:center;gap:12px">'+badge(c)+'<span class="grow t">'+c.n+'</span>'+(over?'<span class="pill over">გადაჭარბება</span>':'')+'<span class="amt num">'+money(v)+'</span></div>'+
      '<div class="catbar"><i style="width:'+pct+'%;background:'+(over?'var(--bad)':c.c)+'"></i></div>'+
      '<div class="sub num" style="margin-top:4px">'+(lim?'ლიმიტი '+money(lim)+' · '+(lim-v>=0?'დარჩა '+money(lim-v):'ზედმეტია '+money(v-lim)):Math.round(spent?v/spent*100:0)+'% ხარჯიდან')+'</div></div>';
  });
  if(!any)h+='<div class="empty">მონაცემები ჯერ არ არის</div>';
  return h+'</div></div>';
}

function vPlan(){
  var tb=totalBudget(),inc=+S.income||0,free=inc-tb;
  var h='<h1>გეგმა</h1><div class="sub" style="margin:0 0 16px">ყოველთვიური შემოსავალი და ლიმიტები კატეგორიებზე.</div>'+banner();
  h+='<div class="section"><h2>შემოსავალი</h2><div class="card"><div class="field"><label for="inc">თვიური შემოსავალი</label><input id="inc" data-bind="income" inputmode="decimal" placeholder="0" value="'+(S.income||'')+'"><span class="unit">₾</span></div></div></div>';
  h+='<div class="section"><h2>ლიმიტები</h2><div class="card">';
  CATS.forEach(function(c){
    h+='<div class="field">'+badge(c)+'<label for="b_'+c.id+'">'+c.n+'</label><input id="b_'+c.id+'" data-bind="b:'+c.id+'" inputmode="decimal" placeholder="0" value="'+(S.budgets[c.id]||'')+'"><span class="unit">₾</span></div>';
  });
  h+='</div><div class="foot num" id="planfoot">'+planFoot(tb,free,inc)+'</div></div>';
  h+='<div class="section"><h2>მონაცემები</h2><div class="card"><div class="stack"><div class="sub">მონაცემები ინახება მხოლოდ ამ ბრაუზერში. შეინახე ასლი, რომ არ დაკარგო.</div>'+
    '<button class="btn plain" style="background:var(--fill)" data-act="export">ასლის გადაწერა</button>'+
    '<textarea class="io" id="io" placeholder="აქ ჩასვი ადრე შენახული ასლი" aria-label="ასლი"></textarea>'+
    '<button class="btn plain" style="background:var(--fill)" data-act="import">აღდგენა ასლიდან</button>'+
    (ui.confirmClear?'<button class="btn danger" data-act="clearAll" style="color:#fff;background:var(--bad)">დარწმუნებული ხარ? წაიშლება ყველაფერი</button>':'<button class="btn danger" style="background:var(--fill)" data-act="clearAsk">ყველა მონაცემის წაშლა</button>')+
    '</div></div></div>';
  return h;
}
function planFoot(tb,free,inc){
  if(!inc)return 'ჩაწერე შემოსავალი, რომ ნახო რამდენი რჩება გაუნაწილებელი.';
  return 'დაგეგმილია '+money(tb)+' · '+(free>=0?'გაუნაწილებელია '+money(free):'ლიმიტები შემოსავალს აღემატება '+money(-free)+'-ით');
}

function render(){
  var v=ui.tab==='days'?vDays():ui.tab==='sum'?vSum():vPlan();
  document.getElementById('app').innerHTML=v;
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<button class="tab" role="tab" aria-selected="'+(ui.tab===t.id)+'" data-tab="'+t.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+t.i+'</svg>'+t.n+'</button>';
  }).join('');
  document.getElementById('fab').hidden=ui.tab==='plan';
  var m=document.getElementById('modal');
  m.innerHTML=ui.sheet?sheetHtml():'';
  var fresh=document.querySelector('#modal .amount input');
  if(fresh&&ui.sheet&&ui.sheet.focus){ui.sheet.focus=false;try{fresh.focus()}catch(e){}}
  if(ui.sheet&&ui.sheet.focusCat){ui.sheet.focusCat=false;var nci=document.getElementById('f_newcat');if(nci)try{nci.focus()}catch(e){}}
  var t=document.getElementById('toastbox');if(t)t.remove();
  if(ui.toast){var d=document.createElement('div');d.id='toastbox';d.className='toast';d.textContent=ui.toast;document.body.appendChild(d)}
}

function sheetHtml(){
  var s=ui.sheet,e=s.e;
  var newBtn='<button class="chip" data-act="newcat" style="color:var(--accent)">+ ახალი კატეგორია</button>';
  var addField=s.adding?'<div class="field"><input id="f_newcat" maxlength="30" placeholder="კატეგორიის სახელი" style="text-align:left;width:auto;flex:1" aria-label="ახალი კატეგორია"><button data-act="addcat" style="color:var(--accent);font-weight:600;padding:6px 0">დამატება</button></div>':'';
  var chips=CATS.map(function(c){return '<button class="chip" data-act="pick" data-cat="'+c.id+'" aria-pressed="'+(e.cat===c.id)+'">'+badge(c)+''+c.n+'</button>'}).join('');
  return '<div class="scrim" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="ხარჯი"><div class="grab"></div>'+
   '<div class="sheethead"><button data-act="closeSheet">გაუქმება</button><b>'+(s.editing?'ხარჯის შეცვლა':'ახალი ხარჯი')+'</b><button data-act="saveSheet" style="font-weight:600">შენახვა</button></div>'+
   '<div class="amount"><input id="f_amt" inputmode="decimal" placeholder="0" value="'+(e.amt||'')+'" aria-label="თანხა" style="'+(e.type==='in'?'color:var(--good)':'')+'"><span>₾</span></div>'+
   (e.type==='in'?'':'<div class="section"><div class="card"><div class="chips">'+chips+newBtn+'</div>'+addField+'</div></div>')+
   '<div class="section"><div class="card"><div class="field"><label for="f_note">აღწერა</label><input id="f_note" placeholder="არასავალდებულო" value="'+esc(e.note||'')+'" style="width:200px"></div>'+
   '<div class="field"><label for="f_date">თარიღი</label><input id="f_date" type="date" value="'+e.date+'" max="'+todayStr+'" style="width:auto"></div></div></div>'+
   (s.editing?(ui.confirmDel?'<button class="btn danger" style="color:#fff;background:var(--bad)" data-act="delete">დადასტურება: წაშლა</button>':'<button class="btn danger" data-act="delAsk">ხარჯის წაშლა</button>'):'')+
   '</div></div>';
}
function openSheet(id){
  ui.confirmDel=false;
  if(id){var x=S.expenses.filter(function(q){return q.id===id})[0];if(!x)return;ui.sheet={editing:true,focus:false,e:{id:x.id,amt:x.amt,cat:x.cat,note:x.note,date:x.date,type:x.type||'out'}}}
  else{var d=ui.month===curMonth?todayStr:ui.month+'-01';ui.sheet={editing:false,focus:true,e:{amt:'',cat:'food',note:'',date:d,type:'out'}}}
  render();
}
function readSheet(){
  var e=ui.sheet.e,a=document.getElementById('f_amt');
  if(a){e.amt=a.value;e.note=document.getElementById('f_note').value;e.date=document.getElementById('f_date').value||e.date}
}
function toast(t){ui.toast=t;render();setTimeout(function(){ui.toast=null;var b=document.getElementById('toastbox');if(b)b.remove()},1800)}
function num(v){return parseFloat(String(v).replace(/\s/g,'').replace(',','.'))}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;ui.confirmClear=false;render();window.scrollTo(0,0);return}
  var a=t.dataset.act;
  if(a==='closeSheet'){if(t.classList.contains('scrim')&&ev.target!==t)return;ui.sheet=null;render();return}
  if(a==='prev'){ui.month=shiftM(ui.month,-1);render()}
  else if(a==='next'){if(ui.month<curMonth){ui.month=shiftM(ui.month,1);render()}}
  else if(a==='edit'){openSheet(t.dataset.id)}
  else if(a==='pick'){readSheet();ui.sheet.e.cat=t.dataset.cat;render()}
  else if(a==='type'){readSheet();ui.sheet.e.type=t.dataset.type;render()}
  else if(a==='newcat'){readSheet();ui.sheet.adding=true;ui.sheet.focusCat=true;render()}
  else if(a==='addcat'){
    var inp=document.getElementById('f_newcat'),nm=inp?inp.value.trim():'';
    if(!nm){if(inp)inp.focus();return}
    readSheet();
    S.customCats=S.customCats||[];
    var nc={id:'c'+uid(),n:nm,c:'var(--c'+(S.customCats.length%6)+')'};
    S.customCats.push(nc);syncCustom();
    ui.sheet.e.cat=nc.id;ui.sheet.adding=false;save();render();
  }
  else if(a==='saveSheet'){
    readSheet();var e=ui.sheet.e,v=num(e.amt);
    if(!(v>0)){var f=document.getElementById('f_amt');if(f)f.focus();return}
    var rec={amt:v,cat:e.type==='in'?'income':e.cat,note:e.note.trim(),date:e.date,type:e.type};
    if(ui.sheet.editing){rec.id=e.id;S.expenses=S.expenses.map(function(x){return x.id===e.id?rec:x})}
    else{rec.id=uid();S.expenses.push(rec)}
    ui.month=e.date.slice(0,7);ui.sheet=null;save();render();toast('შენახულია');
  }
  else if(a==='delAsk'){readSheet();ui.confirmDel=true;render()}
  else if(a==='delete'){var id=ui.sheet.e.id;S.expenses=S.expenses.filter(function(x){return x.id!==id});ui.sheet=null;ui.confirmDel=false;save();render();toast('წაიშალა')}
  else if(a==='clearDemo'){S={income:S.income,budgets:S.budgets,expenses:[],demo:false};save();render()}
  else if(a==='clearAsk'){ui.confirmClear=true;render()}
  else if(a==='clearAll'){S={income:0,budgets:{},expenses:[],demo:false};ui.confirmClear=false;save();render();toast('მონაცემები წაიშალა')}
  else if(a==='export'){
    var txt=JSON.stringify(S),box=document.getElementById('io');box.value=txt;box.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('ასლი გადაწერილია')},function(){toast('მონიშნე და გადაწერე ხელით')})}
    else toast('მონიშნე და გადაწერე ხელით');
  }
  else if(a==='import'){
    try{var o=JSON.parse(document.getElementById('io').value);if(!o||!Array.isArray(o.expenses))throw 0;o.demo=false;S=o;syncCustom();save();render();toast('აღდგენილია')}
    catch(e){toast('ასლი ვერ წაიკითხა')}
  }
});
document.getElementById('fab').addEventListener('click',function(){openSheet()});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.id==='f_newcat'){ev.preventDefault();var b=document.querySelector('[data-act="addcat"]');if(b)b.click()}
});
document.addEventListener('input',function(ev){
  var b=ev.target.dataset&&ev.target.dataset.bind;if(!b)return;
  var v=num(ev.target.value)||0;
  if(b==='income')S.income=v;else S.budgets[b.slice(2)]=v;
  S.demo=S.demo;save();
  var f=document.getElementById('planfoot');if(f){var tb=totalBudget(),inc=+S.income||0;f.textContent=planFoot(tb,inc-tb,inc)}
});
render();
})();
</script>

</body></html>
